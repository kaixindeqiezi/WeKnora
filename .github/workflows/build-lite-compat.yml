name: Build Lite (glibc 2.32 compatible)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag for packaging"
        required: false
        default: "v0.8.3"

permissions:
  contents: read

jobs:
  # Frontend is platform independent; build once and share as artifact.
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 3

  # Build inside AlmaLinux 8 with gcc-toolset-12.
  #
  # Why AlmaLinux 8:
  #   * its glibc is 2.28, well below the target host's 2.32, so the binary
  #     runs there (an ubuntu/bookworm build would need glibc 2.36);
  #   * gcc-toolset-12 provides the C++ ABI that the prebuilt
  #     duckdb-go-bindings archive was compiled against
  #     (std::__throw_bad_array_new_length / CXXABI_1.3.8), which
  #     debian bullseye's gcc 10 and AlmaLinux's gcc 11 cannot resolve.
  build-binary:
    needs: build-frontend
    runs-on: ubuntu-latest
    env:
      GO_VERSION: "1.26"
      EDITION: lite
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the go.mod replace of anydoc points at a local path,
          # and Go resolves the module graph through VCS status, which fails
          # in a detached .git-less workspace.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: web/

      - name: Resolve version
        id: ver
        run: |
          VERSION="${{ inputs.tag }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building ${VERSION} for linux/amd64"

      - name: Build inside AlmaLinux 8 container (glibc 2.28 baseline)
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/src" \
            -w /src \
            -e EDITION=lite \
            -e CGO_ENABLED=1 \
            almalinux:8 \
            bash -euxo pipefail -c '
              dnf install -y gcc-toolset-12 git tar gzip make curl which
              source /opt/rh/gcc-toolset-12/enable
              export PATH=/opt/rh/gcc-toolset-12/root/usr/bin:$PATH
              gcc --version | head -1
              g++ --version | head -1
              ldd --version | head -1
              # sqlite-vec needs SQLITE_INNOCUOUS (SQLite >= 3.31), so build a
              # modern SQLite and point the compiler at it.
              curl -fsSL https://www.sqlite.org/2024/sqlite-autoconf-3450200.tar.gz -o /tmp/sqlite.tgz
              tar -C /tmp -xzf /tmp/sqlite.tgz
              cd /tmp/sqlite-autoconf-3450200
              ./configure --prefix=/usr/local
              make -j2
              make install
              ldconfig
              cd /src
              curl -fsSL https://go.dev/dl/go1.26.0.linux-amd64.tar.gz -o /tmp/go.tgz
              rm -rf /usr/local/go
              tar -C /usr/local -xzf /tmp/go.tgz
              export PATH=/usr/local/go/bin:$PATH
              export GOPATH=/tmp/gopath
              export GOCACHE=/tmp/gocache
              export GOMODCACHE=/tmp/gomodcache
              # go.mod replaces anydoc with a local path, so the module graph
              # needs VCS status to resolve. The checkout carries full
              # history; the fallback only covers a .git-less mount.
              if [ ! -d .git ]; then
                git init -q .
                git config user.email build@local
                git config user.name build
                git commit -q -m build --allow-empty >/dev/null 2>&1 || true
              fi
              git config --global --add safe.directory /src || true
              export CGO_CFLAGS="-Wno-deprecated-declarations -I/usr/local/include"
              export CGO_LDFLAGS="-L/usr/local/lib"
              export LD_LIBRARY_PATH=/usr/local/lib
              export GOFLAGS=-mod=mod
              export GOSUMDB=off
              export GOPRIVATE=*
              export GONOSUMCHECK=1
              go version
              eval "$(./scripts/get_version.sh env)"
              LDFLAGS="-w -s $(./scripts/get_version.sh ldflags)"
              go build -tags "sqlite_fts5" -ldflags="${LDFLAGS}" -o WeKnora-lite ./cmd/server
              ldd ./WeKnora-lite || true
            '

      - name: Package tarball
        run: |
          set -euo pipefail
          ARCHIVE="WeKnora-lite_${{ steps.ver.outputs.version }}_linux_amd64"
          mkdir -p "${ARCHIVE}/web"
          cp WeKnora-lite "${ARCHIVE}/"
          bash ./scripts/copy-licenses.sh "${ARCHIVE}" || true
          cp -r web/* "${ARCHIVE}/web/"
          cp .env.lite.example "${ARCHIVE}/"
          cp docs/LITE.md "${ARCHIVE}/README.md"
          if [ -d config ]; then cp -r config "${ARCHIVE}/config"; fi
          if [ -d migrations/sqlite ]; then
            mkdir -p "${ARCHIVE}/migrations/sqlite"
            cp -r migrations/sqlite/* "${ARCHIVE}/migrations/sqlite/"
          fi
          tar czf "${ARCHIVE}.tar.gz" "${ARCHIVE}"
          sha256sum "${ARCHIVE}.tar.gz" > "${ARCHIVE}.tar.gz.sha256"
          cat "${ARCHIVE}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: weknora-lite-linux-amd64
          path: |
            WeKnora-lite_*.tar.gz
            WeKnora-lite_*.tar.gz.sha256
          retention-days: 30
