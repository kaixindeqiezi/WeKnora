name: Build Lite (glibc 2.32 compatible)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag for packaging"
        required: false
        default: "v0.8.3"

permissions:
  contents: read

jobs:
  # Frontend is platform independent; build once and share as artifact.
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 3

  # Build the Go binary inside a Debian 11 (bullseye) container.
  #
  # Why bullseye: the target host is Alibaba Cloud Linux 3 with glibc 2.32, so
  # an ubuntu/debian 12 build (glibc 2.36) cannot start there. Bullseye ships
  # glibc 2.31, which runs fine on 2.32, and its gcc 10 provides a
  # libstdc++ new enough for the prebuilt duckdb-go-bindings archives (gcc 8
  # on Rocky Linux 8 left __throw_bad_array_new_length undefined).
  build-binary:
    needs: build-frontend
    runs-on: ubuntu-latest
    env:
      GO_VERSION: "1.26"
      EDITION: lite
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: web/

      - name: Resolve version
        id: ver
        run: |
          VERSION="${{ inputs.tag }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building ${VERSION} for linux/amd64"

      - name: Build inside Debian 11 container (glibc 2.31 baseline)
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/src" \
            -w /src \
            -e EDITION=lite \
            -e CGO_ENABLED=1 \
            -e CGO_CFLAGS="-Wno-deprecated-declarations" \
            debian:bullseye \
            bash -euxo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              # bullseye is EOL: deb.debian.org no longer serves it, so point apt
              # at the archive copy that still hosts the .deb files.
              sed -i -e "s|deb.debian.org/debian-security|archive.debian.org/debian-security|g" \
                     -e "s|deb.debian.org/debian|archive.debian.org/debian|g" \
                     -e "s|security.debian.org|archive.debian.org/debian-security|g" \
                     /etc/apt/sources.list
              echo "Acquire::Check-Valid-Until \"false\";" > /etc/apt/apt.conf.d/99no-check-valid-until
              apt-get update -o Acquire::Check-Valid-Until=false
              apt-get install -y --no-install-recommends \
                ca-certificates curl git build-essential libsqlite3-dev pkg-config
              # sqlite-vec needs SQLITE_INNOCUOUS (SQLite >= 3.31); bullseye
              # ships 3.34, which already defines it, but the header must come
              # from a modern SQLite to match the bundled sqlite-vec sources.
              curl -fsSL https://www.sqlite.org/2024/sqlite-autoconf-3450200.tar.gz -o /tmp/sqlite.tgz
              tar -C /tmp -xzf /tmp/sqlite.tgz
              cd /tmp/sqlite-autoconf-3450200
              ./configure --prefix=/usr/local
              make -j2
              make install
              ldconfig
              cd /src
              curl -fsSL https://go.dev/dl/go1.26.0.linux-amd64.tar.gz -o /tmp/go.tgz
              rm -rf /usr/local/go
              tar -C /usr/local -xzf /tmp/go.tgz
              export PATH=/usr/local/go/bin:$PATH
              export GOPATH=/tmp/gopath
              export GOCACHE=/tmp/gocache
              export GOMODCACHE=/tmp/gomodcache
              export CGO_CFLAGS="-Wno-deprecated-declarations -I/usr/local/include"
              export CGO_LDFLAGS="-L/usr/local/lib"
              export LD_LIBRARY_PATH=/usr/local/lib
              go version
              eval "$(./scripts/get_version.sh env)"
              LDFLAGS="-w -s $(./scripts/get_version.sh ldflags)"
              go build -tags "sqlite_fts5" -ldflags="${LDFLAGS}" -o WeKnora-lite ./cmd/server
              ldd ./WeKnora-lite || true
            '

      - name: Package tarball
        run: |
          set -euo pipefail
          ARCHIVE="WeKnora-lite_${{ steps.ver.outputs.version }}_linux_amd64"
          mkdir -p "${ARCHIVE}/web"
          cp WeKnora-lite "${ARCHIVE}/"
          bash ./scripts/copy-licenses.sh "${ARCHIVE}" || true
          cp -r web/* "${ARCHIVE}/web/"
          cp .env.lite.example "${ARCHIVE}/"
          cp docs/LITE.md "${ARCHIVE}/README.md"
          if [ -d config ]; then cp -r config "${ARCHIVE}/config"; fi
          if [ -d migrations/sqlite ]; then
            mkdir -p "${ARCHIVE}/migrations/sqlite"
            cp -r migrations/sqlite/* "${ARCHIVE}/migrations/sqlite/"
          fi
          tar czf "${ARCHIVE}.tar.gz" "${ARCHIVE}"
          sha256sum "${ARCHIVE}.tar.gz" > "${ARCHIVE}.tar.gz.sha256"
          cat "${ARCHIVE}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: weknora-lite-linux-amd64
          path: |
            WeKnora-lite_*.tar.gz
            WeKnora-lite_*.tar.gz.sha256
          retention-days: 30
